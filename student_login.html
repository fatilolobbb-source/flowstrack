<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Étudiant - Connexion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-logo">FlowTrack</div>
  </nav>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Connexion Étudiant</h2>
        <p>Ou inscrivez-vous si vous n'avez pas de compte</p>
      </div>

      <form id="studentLoginForm">
        <div id="studentError" class="error-message" style="display:none;"></div>
        <div class="form-group">
          <label for="studentEmail">Email</label>
          <input id="studentEmail" type="email" required placeholder="votre@email.asp.me">
        </div>
        <div class="form-group">
          <label for="studentPassword">Mot de passe</label>
          <input id="studentPassword" type="password" required>
        </div>
        <button type="submit" class="btn-login">Se connecter</button>
      </form>

      <div style="text-align:center; margin-top:1rem;">
        <a href="signup.html" style="color: var(--bleu-clair); text-decoration:none;">Créer un compte étudiant</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
